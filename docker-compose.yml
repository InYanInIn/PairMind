version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    volumes:
      - ./src/main/resources/docs:/app/src/main/resources/docs
    container_name: spring-app
    ports:
      - "8080:8080"
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333

volumes:
  qdrant_data:
